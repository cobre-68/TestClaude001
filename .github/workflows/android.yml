name: Android-APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk Zentrale.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Zentrale-apk
          path: Zentrale.apk
      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Zentrale (aktuelle Android-App)
          body: |
            Aktuelle Android-Version von Zentrale – Build ${{ github.run_number }}.
            Auf dem Handy **Zentrale.apk** antippen, herunterladen und installieren.
          files: Zentrale.apk
          make_latest: true
